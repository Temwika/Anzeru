# Render Blueprint: one web service (API + web in one container) and a Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets are generated on first deploy.
services:
  - type: web
    name: anzelu
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # Render passes these to the Docker build as build args as well.
      - key: API_URL
        value: http://localhost:4000
      - key: SHOW_DEMO_LOGINS
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MOMO_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: anzelu-db
          property: connectionString

databases:
  - name: anzelu-db
    plan: free
    databaseName: anzelu
    user: anzelu
